name: build
on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}
  group: ${{ github.ref }}

env:
  GOPROXY: https://nexus.prod-cicd.scalable.capital/repository/go-public/

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: 8
          distribution: 'temurin'
          cache: 'maven'
      - run: cd integration-tests/maven && mvn clean verify --batch-mode -Dmaven.test.failure.ignore=true
      - uses: ./
        if: false
        with:
          check_name: Example Surefire Test Report
          report_paths: '**/surefire-reports/*.xml, **/failsafe-reports/*.xml'
      - uses: cclauss/GitHub-Action-for-pytest@0.5.0
        with:
          args: pytest integration-tests/python/ --junit-xml=integration-tests/python/report.xml || exit 0
      - uses: ./
        if: false
        with:
          check_name: Example Pytest Report
          report_paths: integration-tests/python/report.xml
      - uses: actions/setup-go@v5
        with:
          go-version: 1.21.x
      - run: |
          cd integration-tests/go && 
            go test -v ./... || true
          cat > report.xml <<'XML'
          <testsuites>
            <testsuite name="go" tests="3" failures="2">
              <testcase classname="main_test.go" name="TestPassing"/>
              <testcase classname="main_test.go" name="TestFailing">
                <failure message="Failed">main_test.go:12: failing test</failure>
              </testcase>
              <testcase classname="string_test.go" name="TestFailing">
                <failure message="Failed"><![CDATA[string_test.go:7:
                    Error Trace:    /home/runner/work/action-surefire-report/action-surefire-report/integration-tests/go/utils/string_test.go:7
                    Error:          Not equal:
                    expected: "1"
                    actual  : "2"

                    Diff:
                    --- Expected
                    +++ Actual
                    @@ -1 +1 @@
                    -1
                    +2
                    Test:           TestFailing]]></failure>
              </testcase>
            </testsuite>
          </testsuites>
          XML
      - uses: ./
        if: false
        with:
          check_name: Example Go Report
          report_paths: integration-tests/go/report.xml
          file_name_in_stack_trace: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - shell: bash
        run: |
          npm install -g @aikidosec/safe-chain@1.1.9 --engine-strict
          safe-chain setup-ci
      - run: npm install
      - run: npm run eslint
      - run: npm run test
